<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Judul Web -->
  <title>Freedom App</title>
  
  <style>
    /* Reset margin dan padding agar penuh 100% */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Mencegah munculnya scrollbar ganda */
      background-color: #ffffff;
    }
    
    /* Mengatur iframe agar menutupi seluruh layar */
    #gas-app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Link Google Apps Script Terbaru -->
  <iframe id="gas-app" src="https://script.google.com/macros/s/AKfycbyajZoVB6uw64E4dnOMMMg34egTTmhmtCH-n52x43cEKJTo9pywqu3ZI8lGd4uFWQbX/exec"></iframe>
